name: astrbot_plugin_quick_decision
display_name: 快速决策
desc: 使用 AstrBot 官方判断提供商统一决定是否发言、回复策略以及是否配表情包。支持为判断模型填写自定义上下文，并可编辑或新增判断问题及其会话提示。表情包图库交给市场插件「表情包管理器」(anka-afk/astrbot_plugin_meme_manager) 管理，本插件按描述精确选图。面向 QQ 群聊和私聊，支持群聊插话以及群聊/私聊冷场后主动开口。
short_desc: 用判断模型决定是否发言和回复策略，支持自定义判断问题，并从表情包管理器按描述配图。
version: 1.3.1
author: 狼与葡萄酒
astrbot_version: ">=4.29.4,<5"
support_platforms:
  - aiocqhttp
