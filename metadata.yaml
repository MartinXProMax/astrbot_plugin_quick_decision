name: astrbot_plugin_quick_decision
display_name: 快速决策
desc: |-
  使用 AstrBot 官方判断提供商统一决定是否发言、回复策略以及是否配表情包。
  支持自定义判断上下文、判断问题、群聊插话，以及群聊 / 私聊冷场后主动开口。
  面向 QQ（aiocqhttp），表情包由「表情包管理器」管理，本插件按描述精确选图。

  **安装与配置**

  1. 使用 AstrBot >=4.29.4 且 <5，在 WebUI 插件页通过仓库地址安装本插件：
     https://github.com/MartinXProMax/astrbot_plugin_quick_decision
  2. 在「模型提供商 → 判断」配置 System One 判断提供商；本插件不使用聊天模型替代判断提供商。
  3. 如需配表情包，请另行安装并启用[表情包管理器](https://github.com/anka-afk/astrbot_plugin_meme_manager)，并在其页面管理图库与逐图描述。未安装时仅发文字。
  4. 在表情包管理器中关闭「启用主动发送表情工具」，并将「表情发送概率」设为 0；同时关闭 AstrBot 官方「概率主动回复」，避免重复发言或配图。
  5. 在本插件配置中调整群聊 / 私聊策略；可先开启「试运行模式」查看决策日志。

  本插件无额外 Python 依赖。详细说明见[README](https://github.com/MartinXProMax/astrbot_plugin_quick_decision#readme)。
